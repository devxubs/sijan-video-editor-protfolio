<!doctype html>
<html lang="en" class="dark halloween">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Ahsanull Sijan - Video Editor Portfolio</title>
      <link rel="icon" type="image/png" href="/title-icon.png" />
      <link rel="shortcut icon" href="/title-icon.png" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
      <meta
         name="description"
         content="Professional video editor portfolio for Ahsanull Sijan featuring sales engagement videos, direct-response ad creatives, UGC Reels, and custom creative web tools."
      />
      <meta
         property="og:title"
         content="Ahsanull Sijan - Video Editor Portfolio"
      />
      <meta
         property="og:description"
         content="Professional video editor portfolio for Ahsanull Sijan featuring sales engagement videos, direct-response ad creatives, UGC Reels, and custom creative web tools."
      />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
         rel="stylesheet"
      />
      <script>
         (function () {
            try {
               var saved = localStorage.getItem("rohaan_portfolio_theme_v2");
               if (saved === "light") {
                  document.documentElement.classList.remove(
                     "dark",
                     "halloween",
                  );
               } else if (saved === "dark") {
                  document.documentElement.classList.add("dark");
                  document.documentElement.classList.remove("halloween");
               } else {
                  document.documentElement.classList.add("dark", "halloween");
               }
            } catch (e) {
               document.documentElement.classList.add("dark", "halloween");
            }
         })();
      </script>
   </head>
   <body
      class="bg-zinc-950 text-zinc-100 antialiased selection:bg-red-600 selection:text-white"
   >
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
   </body>
</html>
